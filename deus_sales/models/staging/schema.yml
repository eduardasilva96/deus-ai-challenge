
version: 2

models:
  - name: stg_accounts
    columns:
      - name: account_id
        data_tests:
          - not_null
          - unique

  - name: stg_sales_reps
    columns:
      - name: rep_id
        data_tests:
          - not_null
          - unique

  - name: stg_opportunities
    columns:
      - name: opportunity_id
        data_tests:
          - not_null
          - unique

  - name: stg_monthly_targets
    columns:
      - name: month
        data_tests:
          - not_null
      - name: team
        data_tests:
          - not_null
      - name: target_revenue_eur
        data_tests:
          - not_null
